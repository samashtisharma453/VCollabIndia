<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relaxing Balcony Swing Chair</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }

        .image-container {
            width: 100%;
            height: 280px;
            background-color: #e8ecef;
            overflow: hidden;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 24px;
        }

        .tag {
            display: inline-block;
            background-color: #e6f4ea;
            color: #1e8e3e;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .description {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #f0f0f0;
            padding-top: 16px;
        }

        .price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c3e50;
        }

        .btn {
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="image-container">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGjNigjKBmkLR-zIX6EBoIa-DsSOql-y-lgbXqpwUSDSLo2yqLRPMJ62M&s=10" alt="Relaxing Balcony Swing Chair">
        </div>
        <div class="card-content">
            <span class="tag">Outdoor Comfort</span>
            <h2 class="title">Relaxing Balcony Swing Chair</h2>
            <p class="description">Unwind in style with this durable, weather-resistant outdoor swing chair designed for comfort and cozy balcony setups.</p>
            <div class="card-footer">
                <span class="price">$149.99</span>
                <button class="btn">View Details</button>
            </div>
        </div>
    </div>

</body>
</html>
