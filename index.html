<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCollab India Application</title>
    <!-- React & Tailwind CSS CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FBF9F5] text-gray-800 font-sans">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Initial Sample Products Dataset (At least 2 per city: Kolkata, Chennai, Bengaluru, Hyderabad, Delhi-NCR, Mumbai)
        const INITIAL_PRODUCTS = [
            // Kolkata
            { id: 1, name: "1.5 Ton Split Air Conditioner", category: "Appliances", city: "Kolkata", basePrice: 800, originalPrice: 1100, store: "Howrah Electronics (Howrah, Kolkata)", image: "https://m.media-amazon.com/images/I/51OQNTWDPVL._AC_UY327_FMwebp_QL65_.jpg" },
            { id: 2, name: "Minimalist Modern Sofa", category: "Furniture", city: "Kolkata", basePrice: 1000, originalPrice: 1300, store: "Salt Lake Furnishings (Salt Lake, Kolkata)", image: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=600&q=80" },
            
            // Chennai
            { id: 3, name: "Double Door Refrigerator 260L", category: "Appliances", city: "Chennai", basePrice: 950, originalPrice: 1250, store: "T-Nagar Home Hub (T-Nagar, Chennai)", image: "https://images.unsplash.com/photo-1584992236310-6edddc08acff?auto=format&fit=crop&w=600&q=80" },
            { id: 4, name: "Ergonomic Office Chair", category: "Furniture", city: "Chennai", basePrice: 450, originalPrice: 600, store: "Velachery Decors (Velachery, Chennai)", image: "https://images.unsplash.com/photo-1580481072645-022f9a6d1294?auto=format&fit=crop&w=600&q=80" },

            // Bengaluru
            { id: 5, name: "Minimalist Modern Sofa", category: "Furniture", city: "Bengaluru", basePrice: 1000, originalPrice: 1300, store: "Koramangala Decor (Koramangala, Bengaluru)", image: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=600&q=80" },
            { id: 6, name: "1.5 Ton Split Air Conditioner", category: "Appliances", city: "Bengaluru", basePrice: 850, originalPrice: 1150, store: "Indiranagar Digital Store (Indiranagar, Bengaluru)", image: "https://m.media-amazon.com/images/I/51OQNTWDPVL._AC_UY327_FMwebp_QL65_.jpg" },

            // Hyderabad
            { id: 7, name: "1.5 Ton Split Air Conditioner", category: "Appliances", city: "Hyderabad", basePrice: 800, originalPrice: 1100, store: "Sharma Furnitures (Gachibowli, Hyderabad)", image: "https://m.media-amazon.com/images/I/51OQNTWDPVL._AC_UY327_FMwebp_QL65_.jpg" },
            { id: 8, name: "Fully Automatic Washing Machine", category: "Appliances", city: "Hyderabad", basePrice: 750, originalPrice: 1000, store: "Hitech Electronics (Hitech City, Hyderabad)", image: "https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?auto=format&fit=crop&w=600&q=80" }
        ];

        // Shared Logistics Queue State
        const INITIAL_LOGISTICS = [
            { id: "L1", customer: "Rani", route: "Gachibowli → Hitech City", feePaid: "₹689 (60% Adv)", status: "Driver Assigned" }
        ];

        // Admin City/Retailer Statistics State (Real-time tracker with actual listing count)
        const INITIAL_ADMIN_DATA = [
            { city: "Kolkata", stores: [ { name: "Howrah Electronics", blacklisted: false }, { name: "Salt Lake Furnishings", blacklisted: false } ] },
            { city: "Chennai", stores: [ { name: "T-Nagar Home Hub", blacklisted: false }, { name: "Velachery Decors", blacklisted: false } ] },
            { city: "Bengaluru", stores: [ { name: "Koramangala Decor", blacklisted: false }, { name: "Indiranagar Digital Store", blacklisted: false } ] },
            { city: "Hyderabad", stores: [ { name: "Sharma Furnitures", blacklisted: false }, { name: "Hitech Electronics", blacklisted: false } ] }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState("Customer");
            const [selectedCity, setSelectedCity] = useState("Bengaluru");
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [tenure, setTenure] = useState(6); // Default 6 months
            const [products, setProducts] = useState(INITIAL_PRODUCTS);
            const [logistics, setLogistics] = useState(INITIAL_LOGISTICS);
            const [adminData, setAdminData] = useState(INITIAL_ADMIN_DATA);

            // New Stock Form state
            const [newStock, setNewStock] = useState({ name: "", category: "Appliances", basePrice: "", originalPrice: "", image: "" });

            // Dynamic Price Calculation Algorithm
            // 6 Months = Base standard monthly rate (0% discount/surcharge)
            // 3 Months = Shorter commitment (+15% per month)
            // 12 Months = Long term commitment (-15% discount per month)
            const calculatePrice = (basePrice, months) => {
                if (months === 3) return Math.round(basePrice * 1.15);
                if (months === 12) return Math.round(basePrice * 0.85);
                return basePrice;
            };

            const calculateDiscount = (monthly, original) => {
                if (!original || original <= monthly) return 10;
                return Math.round(((original - monthly) / original) * 100);
            };

            // Toggle Blacklist status for Retailers
            const toggleBlacklist = (cityIdx, storeIdx) => {
                const updated = [...adminData];
                updated[cityIdx].stores[storeIdx].blacklisted = !updated[cityIdx].stores[storeIdx].blacklisted;
                setAdminData(updated);
            };

            // Add new shop stock interactively
            const handleAddStock = (e) => {
                e.preventDefault();
                if (!newStock.name || !newStock.basePrice) return;
                const newEntry = {
                    id: Date.now(),
                    name: newStock.name,
                    category: newStock.category,
                    city: "Hyderabad",
                    basePrice: Number(newStock.basePrice),
                    originalPrice: Number(newStock.originalPrice) || Number(newStock.basePrice) * 1.3,
                    store: "Sharma Furnitures (Gachibowli, Hyderabad)",
                    image: newStock.image || "https://m.media-amazon.com/images/I/51OQNTWDPVL._AC_UY327_FMwebp_QL65_.jpg"
                };
                setProducts([newEntry, ...products]);
                setNewStock({ name: "", category: "Appliances", basePrice: "", originalPrice: "", image: "" });
                alert("New shop stock successfully added and published to the live catalog!");
            };

            const filteredProducts = products.filter(p => p.city === selectedCity);

            return (
                <div class="min-h-screen flex flex-col">
                    {/* TOP NAVBAR */}
                    <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between sticky top-0 z-50">
                        <div class="flex items-center gap-6">
                            <h1 class="text-2xl font-bold text-teal-800 tracking-tight">VCollab India<span class="text-amber-500">.</span></h1>
                            <select 
                                class="bg-gray-50 border border-gray-300 rounded-full px-3 py-1 text-sm font-medium text-gray-700 outline-none"
                                value={selectedCity}
                                onChange={(e) => setSelectedCity(e.target.value)}
                            >
                                <option value="Bengaluru">📍 Bengaluru</option>
                                <option value="Kolkata">📍 Kolkata</option>
                                <option value="Chennai">📍 Chennai</option>
                                <option value="Hyderabad">📍 Hyderabad</option>
                            </select>
                        </div>

                        {/* NAV TAB SWITCHER */}
                        <div class="flex items-center gap-2 bg-gray-100 p-1 rounded-full text-sm font-medium">
                            <button onClick={() => { setActiveTab("Customer"); setSelectedProduct(null); }} class={`px-4 py-1.5 rounded-full transition ${activeTab === "Customer" ? "bg-white shadow text-teal-800" : "text-gray-600 hover:text-black"}`}>Customer</button>
                            <button onClick={() => { setActiveTab("Relocate"); setSelectedProduct(null); }} class={`px-4 py-1.5 rounded-full transition ${activeTab === "Relocate" ? "bg-white shadow text-teal-800" : "text-gray-600 hover:text-black"}`}>Relocate with VCollab</button>
                            <button onClick={() => { setActiveTab("Rani"); setSelectedProduct(null); }} class={`px-4 py-1.5 rounded-full transition ${activeTab === "Rani" ? "bg-white shadow text-teal-800" : "text-gray-600 hover:text-black"}`}>Rani</button>
                            <button onClick={() => { setActiveTab("Retailer"); setSelectedProduct(null); }} class={`px-4 py-1.5 rounded-full transition ${activeTab === "Retailer" ? "bg-white shadow text-teal-800" : "text-gray-600 hover:text-black"}`}>Retailer</button>
                            <button onClick={() => { setActiveTab("Admin"); setSelectedProduct(null); }} class={`px-4 py-1.5 rounded-full transition ${activeTab === "Admin" ? "bg-white shadow text-teal-800" : "text-gray-600 hover:text-black"}`}>Admin</button>
                        </div>
                    </header>

                    <main class="flex-1 max-w-6xl w-full mx-auto p-6">
                        
                        {/* VIEW 1: CUSTOMER CATALOG */}
                        {activeTab === "Customer" && !selectedProduct && (
                            <div>
                                <h2 class="text-xl font-bold mb-4 text-gray-800">Available Rental Products in {selectedCity}</h2>
                                {filteredProducts.length === 0 ? (
                                    <p class="text-gray-500">No items available in this city right now.</p>
                                ) : (
                                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                                        {filteredProducts.map(prod => (
                                            <div key={prod.id} class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
                                                <img src={prod.image} alt={prod.name} class="w-full h-48 object-cover bg-gray-100" />
                                                <div class="p-4 flex-1 flex flex-col justify-between">
                                                    <div>
                                                        <span class="text-xs font-semibold text-teal-700 uppercase tracking-wide">STORE: {prod.store}</span>
                                                        <h3 class="text-base font-bold text-gray-900 mt-1">{prod.name}</h3>
                                                    </div>
                                                    <div class="mt-4">
                                                        <div class="flex items-baseline gap-2">
                                                            <span class="text-xl font-extrabold text-gray-900">₹{prod.basePrice}/mo</span>
                                                            <span class="text-sm line-through text-gray-400">₹{prod.originalPrice}</span>
                                                            <span class="text-xs font-semibold text-green-700 bg-green-100 px-1.5 py-0.5 rounded">
                                                                {calculateDiscount(prod.basePrice, prod.originalPrice)}% OFF
                                                            </span>
                                                        </div>
                                                        <div class="mt-3 flex gap-2">
                                                            <button 
                                                                onClick={() => setSelectedProduct(prod)}
                                                                class="flex-1 bg-teal-700 hover:bg-teal-800 text-white font-medium py-2 px-3 rounded-lg text-sm transition"
                                                            >
                                                                View Details
                                                            </button>
                                                            <button class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 px-3 rounded-lg text-sm transition">
                                                                + Cart
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* VIEW 1.1: SINGLE PRODUCT DETAILS (INTERACTIVE TENURE & DYNAMIC PRICE CALCULATION) */}
                        {activeTab === "Customer" && selectedProduct && (
                            <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm max-w-4xl mx-auto">
                                <button onClick={() => setSelectedProduct(null)} class="text-sm text-teal-700 font-medium mb-4 hover:underline">← Back to Catalog</button>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <img src={selectedProduct.image} alt={selectedProduct.name} class="w-full h-80 object-cover rounded-lg bg-gray-100" />
                                    <div class="flex flex-col justify-between">
                                        <div>
                                            <span class="text-xs font-semibold text-teal-700 uppercase tracking-wide">FULFILLED BY: {selectedProduct.store}</span>
                                            <h2 class="text-2xl font-bold text-gray-900 mt-1">{selectedProduct.name}</h2>
                                            
                                            {/* Dynamic Calculated Pricing Display */}
                                            <div class="flex items-baseline gap-3 mt-3">
                                                <span class="text-3xl font-extrabold text-gray-900">
                                                    ₹{calculatePrice(selectedProduct.basePrice, tenure)}/mo
                                                </span>
                                                <span class="text-base line-through text-gray-400">
                                                    ₹{selectedProduct.originalPrice}
                                                </span>
                                                <span class="text-xs font-bold text-green-700 bg-green-100 px-2 py-1 rounded">
                                                    {calculateDiscount(calculatePrice(selectedProduct.basePrice, tenure), selectedProduct.originalPrice)}% OFF
                                                </span>
                                            </div>
                                            <p class="text-xs text-gray-500 mt-1">*Price auto-calculated based on selected tenure duration.</p>
                                            
                                            <p class="text-gray-600 text-sm mt-4">Elegantly maintained product ready for delivery to modern workspace homes.</p>

                                            {/* Interactive Tenure Options */}
                                            <div class="mt-6">
                                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">TENURE OPTION</label>
                                                <div class="grid grid-cols-3 gap-3">
                                                    <button 
                                                        onClick={() => setTenure(6)}
                                                        class={`py-2 px-3 text-sm rounded-lg border font-medium transition ${tenure === 6 ? "bg-teal-50 border-teal-600 text-teal-800 shadow-sm" : "border-gray-300 text-gray-700 hover:border-gray-400"}`}
                                                    >
                                                        6 Months <span class="block text-[10px] text-teal-600">(Best Rate)</span>
                                                    </button>
                                                    <button 
                                                        onClick={() => setTenure(3)}
                                                        class={`py-2 px-3 text-sm rounded-lg border font-medium transition ${tenure === 3 ? "bg-teal-50 border-teal-600 text-teal-800 shadow-sm" : "border-gray-300 text-gray-700 hover:border-gray-400"}`}
                                                    >
                                                        3 Months
                                                    </button>
                                                    <button 
                                                        onClick={() => setTenure(12)}
                                                        class={`py-2 px-3 text-sm rounded-lg border font-medium transition ${tenure === 12 ? "bg-teal-50 border-teal-600 text-teal-800 shadow-sm" : "border-gray-300 text-gray-700 hover:border-gray-400"}`}
                                                    >
                                                        12 Months
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        <button class="w-full mt-6 bg-teal-700 hover:bg-teal-800 text-white font-bold py-3 rounded-lg transition">
                                            Add to Cart & Proceed →
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW 2: RELOCATE WITH VCOLLAB (ATTRACTIVE PITCH, NO PLATFORM FEE DISCLOSURE) */}
                        {activeTab === "Relocate" && (
                            <div class="bg-white border border-gray-200 rounded-xl p-8 shadow-sm max-w-2xl mx-auto">
                                <h2 class="text-2xl font-bold text-teal-900">Relocate with VCollab</h2>
                                
                                {/* Attractive Pitch Without Platform Fee Details */}
                                <p class="text-gray-600 mt-2 leading-relaxed text-sm">
                                    <strong class="text-gray-800">Shifting homes? Don't leave your comfort behind!</strong> We make intra-city moves completely hassle-free. Transition your active rented items seamlessly to your new locality with certified packing and instant reinstallations—zero penalty, zero stress!
                                </p>

                                <div class="mt-6 space-y-4">
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Select Product to Relocate</label>
                                        <select class="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:border-teal-600">
                                            <option>1.5 Ton Split Air Conditioner (Sharma Furnitures)</option>
                                            <option>Living Sofa (Sharma Furnitures)</option>
                                        </select>
                                    </div>

                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Current Address Locality</label>
                                            <input type="text" value="Gachibowli, Hyderabad" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-gray-50" readonly />
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Destination Relocation Locality</label>
                                            <input type="text" defaultValue="Hitech City, Hyderabad" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:border-teal-600" />
                                        </div>
                                    </div>

                                    {/* Transparent Customer Logistics Breakdown */}
                                    <div class="bg-amber-50/50 border border-amber-200/60 rounded-xl p-4 mt-4">
                                        <h4 class="font-bold text-sm text-gray-800">Transparent Service Fee Breakup:</h4>
                                        <div class="flex justify-between text-sm mt-2 text-gray-700">
                                            <span>Base Transit & Packing Fee</span>
                                            <span class="font-semibold">₹799</span>
                                        </div>
                                        <div class="flex justify-between text-sm mt-1 text-gray-700">
                                            <span class="flex items-center gap-1.5"><input type="checkbox" checked readOnly class="accent-teal-700" /> Appliance Reinstallation (AC / Washing Machine)</span>
                                            <span class="font-semibold">₹350</span>
                                        </div>
                                        <hr class="my-2 border-amber-200" />
                                        <div class="flex justify-between text-base font-bold text-gray-900">
                                            <span>Total Relocation Service Fee</span>
                                            <span class="text-teal-800">₹1,149</span>
                                        </div>
                                        <div class="text-xs text-teal-700 mt-1 font-medium">
                                            • 60% Advance Payment Required: <strong>₹689</strong><br />
                                            • 40% Balance Payable After Relocation: ₹460
                                        </div>
                                    </div>

                                    <button class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-3 rounded-lg transition mt-2">
                                        Schedule Relocation Shift
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* VIEW 3: RANI INTERFACE (LOGISTICS TRACKING VISIBLE) */}
                        {activeTab === "Rani" && (
                            <div class="space-y-6">
                                <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
                                    <h2 class="text-xl font-bold text-gray-800">Welcome, Rani!</h2>
                                    <p class="text-sm text-gray-500">Manage your active subscriptions & relocation shifts here.</p>
                                </div>

                                {/* Shared Logistics Dashboard Component */}
                                <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
                                    <div class="flex items-center justify-between mb-4">
                                        <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                                            🚚 Logistics & Shifts (Live Tracking)
                                        </h3>
                                        <span class="text-xs bg-teal-100 text-teal-800 px-2.5 py-1 rounded-full font-bold">1 Active Shift</span>
                                    </div>
                                    <div class="overflow-x-auto">
                                        <table class="w-full text-left text-sm">
                                            <thead class="bg-gray-50 text-gray-600 border-b">
                                                <tr>
                                                    <th class="p-3">Customer</th>
                                                    <th class="p-3">Route</th>
                                                    <th class="p-3">Fee Paid</th>
                                                    <th class="p-3">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {logistics.map(item => (
                                                    <tr key={item.id} class="border-b">
                                                        <td class="p-3 font-semibold text-gray-800">{item.customer}</td>
                                                        <td class="p-3">{item.route}</td>
                                                        <td class="p-3 text-teal-700 font-semibold">{item.feePaid}</td>
                                                        <td class="p-3">
                                                            <span class="bg-green-100 text-green-800 px-2.5 py-1 rounded-full text-xs font-bold">{item.status}</span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW 4: RETAILER INTERFACE (IMPROVED NAME PLACEMENT, WORKING ADD STOCK & LOGISTICS) */}
                        {activeTab === "Retailer" && (
                            <div class="space-y-6">
                                <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm flex items-center justify-between">
                                    <div>
                                        <span class="text-xs font-bold text-teal-700 tracking-wider uppercase">Retailer Portal</span>
                                        <h2 class="text-2xl font-bold text-gray-900">Sharma Furnitures (Gachibowli)</h2>
                                        <p class="text-xs text-gray-500">Partner Store Network Management & Logistics Operations Hub</p>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {/* STORE EARNINGS & IDLE STOCK BOX (Store Name Included Inside) */}
                                    <div class="md:col-span-1 bg-white border border-gray-200 rounded-xl p-5 shadow-sm space-y-4">
                                        <div class="border-b pb-2">
                                            <span class="text-[10px] font-bold text-gray-400 uppercase">Shop Name</span>
                                            <h3 class="text-base font-bold text-teal-900">📊 Sharma Furnitures — Store Earnings & Idle Stock</h3>
                                        </div>

                                        <div class="grid grid-cols-2 gap-3">
                                            <div class="bg-amber-50/50 p-3 rounded-lg border border-amber-100">
                                                <span class="text-xs text-gray-500">Monthly Net Revenue</span>
                                                <p class="text-lg font-bold text-teal-800">₹42,350</p>
                                            </div>
                                            <div class="bg-amber-50/50 p-3 rounded-lg border border-amber-100">
                                                <span class="text-xs text-gray-500">Platform Comm. (15%)</span>
                                                <p class="text-lg font-bold text-amber-700">₹7,470</p>
                                            </div>
                                            <div class="bg-amber-50/50 p-3 rounded-lg border border-amber-100">
                                                <span class="text-xs text-gray-500">Idle Capacity Utilized</span>
                                                <p class="text-lg font-bold text-gray-800">92%</p>
                                            </div>
                                            <div class="bg-amber-50/50 p-3 rounded-lg border border-amber-100">
                                                <span class="text-xs text-gray-500">Idle Stock Units</span>
                                                <p class="text-lg font-bold text-green-700">4 Units</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* INTERACTIVE ADD NEW SHOP STOCK FORM */}
                                    <div class="md:col-span-2 bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                                        <h3 class="text-base font-bold text-gray-900 mb-3">+ Add New Shop Stock (Interactive)</h3>
                                        <form onSubmit={handleAddStock} class="grid grid-cols-2 gap-3">
                                            <div>
                                                <label class="block text-xs font-medium text-gray-600">Product Title</label>
                                                <input required type="text" placeholder="e.g. 1.5 Ton Split Air Conditioner" value={newStock.name} onChange={(e) => setNewStock({...newStock, name: e.target.value})} class="w-full border rounded p-2 text-sm outline-none focus:border-teal-600" />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-medium text-gray-600">Category</label>
                                                <select value={newStock.category} onChange={(e) => setNewStock({...newStock, category: e.target.value})} class="w-full border rounded p-2 text-sm outline-none focus:border-teal-600">
                                                    <option>Appliances</option>
                                                    <option>Furniture</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label class="block text-xs font-medium text-gray-600">Monthly Rent Rate (₹)</label>
                                                <input required type="number" placeholder="800" value={newStock.basePrice} onChange={(e) => setNewStock({...newStock, basePrice: e.target.value})} class="w-full border rounded p-2 text-sm outline-none focus:border-teal-600" />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-medium text-gray-600">Original Rate (₹)</label>
                                                <input type="number" placeholder="1100" value={newStock.originalPrice} onChange={(e) => setNewStock({...newStock, originalPrice: e.target.value})} class="w-full border rounded p-2 text-sm outline-none focus:border-teal-600" />
                                            </div>
                                            <div class="col-span-2">
                                                <label class="block text-xs font-medium text-gray-600">Image URL</label>
                                                <input type="text" placeholder="https://..." value={newStock.image} onChange={(e) => setNewStock({...newStock, image: e.target.value})} class="w-full border rounded p-2 text-sm outline-none focus:border-teal-600" />
                                            </div>
                                            <button type="submit" class="col-span-2 bg-teal-700 hover:bg-teal-800 text-white font-bold py-2 rounded text-sm transition mt-1">
                                                Publish Stock to Live Catalog
                                            </button>
                                        </form>
                                    </div>
                                </div>

                                {/* LOGISTICS SECTION ON RETAILER INTERFACE */}
                                <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
                                    <h3 class="text-lg font-bold text-gray-900 mb-3 flex items-center gap-2">
                                        🚚 Logistics & Shifts (Customer & Retailer View)
                                    </h3>
                                    <div class="overflow-x-auto">
                                        <table class="w-full text-left text-sm">
                                            <thead class="bg-gray-50 text-gray-600 border-b">
                                                <tr>
                                                    <th class="p-3">Customer</th>
                                                    <th class="p-3">Route</th>
                                                    <th class="p-3">Fee Paid</th>
                                                    <th class="p-3">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {logistics.map(item => (
                                                    <tr key={item.id} class="border-b">
                                                        <td class="p-3 font-semibold text-gray-800">{item.customer}</td>
                                                        <td class="p-3">{item.route}</td>
                                                        <td class="p-3 text-teal-700 font-semibold">{item.feePaid}</td>
                                                        <td class="p-3">
                                                            <span class="bg-green-100 text-green-800 px-2.5 py-1 rounded-full text-xs font-bold">{item.status}</span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VIEW 5: REALISTIC ADMIN INTERFACE (REAL-TIME TRACKER, REAL COMMISSIONS & BLACKLISTING) */}
                        {activeTab === "Admin" && (
                            <div class="space-y-6">
                                <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
                                    <h2 class="text-2xl font-bold text-gray-900">VCollab Real-Time City & Retailer Tracker</h2>
                                    <p class="text-xs text-gray-500 mt-1">Live realistic platform analytics: ~1-2 active retailers per city listed without fabricated story assumptions.</p>
                                </div>

                                <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                                    <table class="w-full text-left text-sm">
                                        <thead class="bg-gray-100 text-gray-700 font-bold border-b">
                                            <tr>
                                                <th class="p-4">City Hub</th>
                                                <th class="p-4">Listed Retailers</th>
                                                <th class="p-4">Active Rented Items</th>
                                                <th class="p-4">Gross Monthly GMV</th>
                                                <th class="p-4">15% Commission Calculation</th>
                                                <th class="p-4 text-center">Blacklist / Fraud Action</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-gray-200">
                                            {adminData.map((data, cityIdx) => {
                                                const cityProducts = products.filter(p => p.city === data.city);
                                                const activeUnits = cityProducts.length;
                                                const grossGMV = cityProducts.reduce((sum, p) => sum + p.basePrice, 0);
                                                const commission = Math.round(grossGMV * 0.15);

                                                return (
                                                    <tr key={data.city} class="hover:bg-gray-50">
                                                        <td class="p-4 font-bold text-gray-900">{data.city}</td>
                                                        <td class="p-4">
                                                            <div class="space-y-1">
                                                                {data.stores.map((st, storeIdx) => (
                                                                    <div key={st.name} class="flex items-center gap-2">
                                                                        <span class={`text-xs px-2 py-0.5 rounded font-medium ${st.blacklisted ? "line-through bg-red-100 text-red-700" : "bg-gray-100 text-gray-800"}`}>
                                                                            {st.name}
                                                                        </span>
                                                                        {st.blacklisted && <span class="text-[10px] font-bold text-red-600">[BLACKLISTED]</span>}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </td>
                                                        <td class="p-4 font-medium">{activeUnits} Units</td>
                                                        <td class="p-4 font-semibold text-gray-800">₹{grossGMV}</td>
                                                        <td class="p-4 font-bold text-teal-800">
                                                            ₹{commission} <span class="text-[10px] text-gray-400 font-normal">(15% of ₹{grossGMV})</span>
                                                        </td>
                                                        <td class="p-4 text-center">
                                                            <div class="flex justify-center gap-2">
                                                                {data.stores.map((st, storeIdx) => (
                                                                    <button 
                                                                        key={st.name}
                                                                        onClick={() => toggleBlacklist(cityIdx, storeIdx)}
                                                                        title={st.blacklisted ? "Reactivate Store" : "Blacklist due to fraud/scam"}
                                                                        class={`p-1.5 rounded-full border transition ${st.blacklisted ? "bg-red-600 text-white border-red-600" : "bg-white text-gray-600 border-gray-300 hover:bg-red-50 hover:text-red-600 hover:border-red-400"}`}
                                                                    >
                                                                        🚫
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
