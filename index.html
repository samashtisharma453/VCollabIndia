<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Interface Demo</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      background-color: #0066cc;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background-color: #0052a3;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Modal Container */
    .modal-container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      transform: translateY(-20px);
      transition: transform 0.3s ease;
      position: relative;
    }

    .modal-overlay.active .modal-container {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eef0f3;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 18px;
      color: #1a1a1a;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: #888;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #333;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }

    .form-group textarea,
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group textarea:focus,
    .form-group input:focus {
      border-color: #0066cc;
    }

    /* Payment Option Selectors */
    .payment-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .payment-option {
      position: relative;
    }

    .payment-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .payment-option label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      color: #555;
      transition: all 0.2s ease;
      text-align: center;
    }

    .payment-option input[type="radio"]:checked + label {
      border-color: #0066cc;
      background-color: #f0f7ff;
      color: #0066cc;
    }

    /* Dynamic Payment Method Input Fields */
    .payment-details {
      margin-top: 14px;
      display: none;
    }

    .payment-details.active {
      display: block;
    }

    .submit-btn {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <!-- Triggers for different site actions -->
  <button class="btn" onclick="openPaymentModal('Cart Checkout', 1250)">Checkout Cart</button>
  <button class="btn" onclick="openPaymentModal('Scheduled Relocation', 3500)">Schedule Relocation</button>
  <button class="btn" onclick="openPaymentModal('Return Processing Fee', 150)">Initiate Return</button>

  <!-- Reusable Payment Modal UI -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalTitle">Complete Payment</h3>
        <button class="close-btn" onclick="closePaymentModal()">&times;</button>
      </div>

      <form id="paymentForm" onsubmit="handlePaymentSubmit(event)">
        <!-- Service/Item Context -->
        <div class="form-group">
          <label>Amount Due</label>
          <input type="text" id="displayAmount" readonly style="background-color: #f8f9fa; font-weight: bold;">
        </div>

        <!-- Full Delivery/Service Address -->
        <div class="form-group">
          <label for="fullAddress">Full Delivery Address *</label>
          <textarea id="fullAddress" rows="3" placeholder="House/Flat No., Street, Area, City, Pincode" required></textarea>
        </div>

        <!-- Payment Method Selection -->
        <div class="form-group">
          <label>Select Payment Method *</label>
          <div class="payment-options">
            <div class="payment-option">
              <input type="radio" id="payUpi" name="paymentMethod" value="UPI" required onchange="togglePaymentFields()">
              <label for="payUpi">UPI</label>
            </div>
            <div class="payment-option">
              <input type="radio" id="payCard" name="paymentMethod" value="Card" onchange="togglePaymentFields()">
              <label for="payCard">Card</label>
            </div>
            <div class="payment-option">
              <input type="radio" id="payCash" name="paymentMethod" value="Cash" onchange="togglePaymentFields()">
              <label for="payCash">Cash</label>
            </div>
          </div>
        </div>

        <!-- Dynamic Fields for UPI -->
        <div class="payment-details" id="upiDetails">
          <div class="form-group">
            <label for="upiId">Enter UPI ID (e.g., username@upi)</label>
            <input type="text" id="upiId" placeholder="example@okhdfcbank">
          </div>
        </div>

        <!-- Dynamic Fields for Card -->
        <div class="payment-details" id="cardDetails">
          <div class="form-group">
            <label for="cardNumber">Card Number</label>
            <input type="text" id="cardNumber" placeholder="1234 5678 9101 1121" maxlength="19">
          </div>
        </div>

        <!-- Dynamic Fields for Cash -->
        <div class="payment-details" id="cashDetails">
          <p style="font-size: 13px; color: #666;">Pay with cash upon delivery or service completion.</p>
        </div>

        <button type="submit" class="submit-btn">Confirm & Pay</button>
      </form>
    </div>
  </div>

  <script>
    let activeContext = '';

    // Function to open modal from anywhere on your site
    function openPaymentModal(title, amount) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('displayAmount').value = `₹${amount}`;
      activeContext = title;
      
      const modal = document.getElementById('paymentModal');
      modal.classList.add('active');
    }

    // Function to close modal
    function closePaymentModal() {
      const modal = document.getElementById('paymentModal');
      modal.classList.remove('active');
      document.getElementById('paymentForm').reset();
      hideAllPaymentDetails();
    }

    // Toggle fields based on payment method selection
    function togglePaymentFields() {
      hideAllPaymentDetails();
      const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

      if (selectedMethod === 'UPI') {
        document.getElementById('upiDetails').classList.add('active');
      } else if (selectedMethod === 'Card') {
        document.getElementById('cardDetails').classList.add('active');
      } else if (selectedMethod === 'Cash') {
        document.getElementById('cashDetails').classList.add('active');
      }
    }

    function hideAllPaymentDetails() {
      document.querySelectorAll('.payment-details').forEach(el => el.classList.remove('active'));
    }

    // Form Submission Handler
    function handlePaymentSubmit(event) {
      event.preventDefault();

      const address = document.getElementById('fullAddress').value;
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

      const payload = {
        actionContext: activeContext,
        address: address,
        paymentMethod: paymentMethod,
        timestamp: new Date().toISOString()
      };

      if (paymentMethod === 'UPI') {
        payload.upiId = document.getElementById('upiId').value;
      } else if (paymentMethod === 'Card') {
        payload.cardNumber = document.getElementById('cardNumber').value;
      }

      console.log('Submitted Data:', payload);
      alert(`Order confirmed for ${activeContext} using ${paymentMethod}!`);

      closePaymentModal();
    }
  </script>
</body>
</html>
